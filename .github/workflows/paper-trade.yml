name: Paper trade

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:          # "Run workflow" button for a manual check
  push:                       # run when code/config changes (the bot's own data commits don't trigger this)
    branches: [main]
    paths-ignore: ["data/**", "dashboard/**"]

concurrency:
  group: paper-trader
  cancel-in-progress: false

permissions:
  contents: write   # saves data/ (paper account + status.json) back to this repo
  issues: write     # opens an issue (GitHub notifies you) when the $100 goal is hit

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Honor emergency stop
        run: |
          mkdir -p data
          if [ -f EMERGENCY_STOP ]; then date -u > data/EMERGENCY_STOP; else rm -f data/EMERGENCY_STOP; fi

      - name: Check prices and paper-trade
        run: python3 bot.py once

      - name: Report
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 bot.py report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify (goal reached / big loss)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/notify.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$(head -1 data/notify.md)" --body "$(tail -n +2 data/notify.md)"
            rm data/notify.md
          fi

      - name: Save paper account to repo
        if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "tick $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
